<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Coaching Site No Longer Active</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #1f2933;
            --muted: #5d6773;
            --paper: #f7f3eb;
            --accent: #2f6f63;
            --line: rgba(31, 41, 51, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(47, 111, 99, 0.14), transparent 28rem),
                linear-gradient(135deg, #f7f3eb 0%, #eef2ee 100%);
        }

        main {
            width: min(100%, 760px);
            padding: clamp(28px, 6vw, 64px);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.74);
            box-shadow: 0 24px 80px rgba(31, 41, 51, 0.12);
        }

        .kicker {
            margin: 0 0 16px;
            color: var(--accent);
            font-size: 0.84rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            max-width: 12ch;
            font-size: clamp(2.35rem, 7vw, 5.1rem);
            line-height: 0.96;
            letter-spacing: 0;
        }

        p {
            max-width: 42rem;
            margin: 28px 0 0;
            color: var(--muted);
            font-size: clamp(1.05rem, 2.2vw, 1.28rem);
            line-height: 1.65;
        }

        .divider {
            width: 100%;
            height: 1px;
            margin: 36px 0 0;
            background: var(--line);
        }

        .note {
            margin-top: 24px;
            font-size: 0.96rem;
        }
    </style>
</head>
<body>
    <main aria-labelledby="page-title">
        <p class="kicker">Coaching Update</p>
        <h1 id="page-title">This site is no longer active.</h1>
        <p>
            Coaching clinic registration and related pages have been closed. This website is no longer accepting registrations, scheduling clinics, or managing participant information.
        </p>
        <div class="divider" aria-hidden="true"></div>
        <p class="note">
            Thank you for your interest and support.
        </p>
    </main>
</body>
</html>
